<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340" font-family="sans-serif">
  <style>
    .pt { fill: #0E7C86; }
    .lbl { font-size: 13px; fill: #222; }
    .leg { font-size: 12px; fill: #555; }
    .tan { stroke: #999; stroke-width: 1.5; stroke-dasharray: 4 3; fill: none; }
    .curve { stroke: #0E7C86; stroke-width: 2.5; fill: none; }
    .radio { stroke: #bbb; stroke-width: 1; fill: none; }
  </style>
  <rect width="520" height="340" fill="#ffffff"/>
  <text x="20" y="26" font-size="16" font-weight="bold">Curva horizontal (circular)</text>

  <!-- tangents -->
  <line x1="60" y1="280" x2="230" y2="200" class="tan"/>
  <line x1="420" y1="90" x2="300" y2="150" class="tan"/>

  <!-- PI -->
  <circle cx="260" cy="185" r="4" fill="#D7263D"/>
  <text x="268" y="180" class="lbl">PI</text>
  <line x1="230" y1="200" x2="260" y2="185" class="tan"/>
  <line x1="260" y1="185" x2="300" y2="150" class="tan"/>

  <!-- curve arc from PC to PT -->
  <path d="M 230 200 A 120 120 0 0 1 300 150" class="curve"/>
  <circle cx="230" cy="200" r="5" class="pt"/>
  <text x="195" y="215" class="lbl">PC</text>
  <circle cx="300" cy="150" r="5" class="pt"/>
  <text x="308" y="150" class="lbl">PT</text>

  <!-- center and radius -->
  <circle cx="260" cy="60" r="4" fill="#333"/>
  <text x="268" y="58" class="lbl">O</text>
  <line x1="260" y1="60" x2="230" y2="200" class="radio"/>
  <line x1="260" y1="60" x2="300" y2="150" class="radio"/>
  <text x="155" y="130" class="leg">R</text>

  <!-- external E and middle ordinate M (schematic) -->
  <line x1="260" y1="185" x2="260" y2="163" stroke="#D7263D" stroke-width="1.5" marker-end="url(#a2)"/>
  <text x="266" y="178" class="leg" fill="#D7263D" font-size="11">E (externa)</text>

  <text x="20" y="310" class="leg">PC = inicio de curva · PI = intersección de tangentes · PT = fin de curva</text>
  <text x="20" y="328" class="leg">T = R·tan(Δ/2) · L = R·Δ(rad) · estacado cada intervalo elegido, de PC a PT</text>

  <defs>
    <marker id="a2" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#D7263D"/>
    </marker>
  </defs>
</svg>
