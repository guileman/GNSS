<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320" font-family="sans-serif">
  <style>
    .lbl { font-size: 12px; fill: #222; }
    .leg { font-size: 11px; fill: #555; }
    .pt { fill: #0E7C86; }
    .a { fill: none; stroke: #0E7C86; stroke-width: 2.5; }
    .b { fill: #D7263D; fill-opacity: 0.12; stroke: #D7263D; stroke-width: 2.5; }
    .card { fill: #ffffff; stroke: #bbb; stroke-width: 1; }
    .line { stroke: #ddd; stroke-width: 1; }
  </style>
  <rect width="560" height="320" fill="#ffffff"/>
  <text x="20" y="26" font-size="16" font-weight="bold">Reporte PDF: bloques de medición</text>

  <text x="20" y="54" class="lbl">1) Elegís puntos y tocás «Agregar al reporte»</text>
  <line x1="40" y1="110" x2="150" y2="85" class="a"/>
  <circle cx="40" cy="110" r="5" class="pt"/><circle cx="150" cy="85" r="5" class="pt"/>
  <text x="30" y="130" class="leg">P1</text><text x="145" y="106" class="leg">P2</text>
  <text x="40" y="150" class="leg" fill="#0E7C86">Bloque 1 (2 puntos)</text>

  <polygon points="50,200 130,185 150,250 70,270" class="b"/>
  <circle cx="50" cy="200" r="5" fill="#D7263D"/><circle cx="130" cy="185" r="5" fill="#D7263D"/>
  <circle cx="150" cy="250" r="5" fill="#D7263D"/><circle cx="70" cy="270" r="5" fill="#D7263D"/>
  <text x="165" y="230" class="leg" fill="#D7263D">Bloque 2 (4 puntos, cerrado)</text>
  <text x="20" y="300" class="leg">Cada vez que agregás, la selección se limpia para armar el siguiente.</text>

  <text x="300" y="54" class="lbl">2) En el PDF, un cuadro por bloque</text>
  <rect x="300" y="64" width="240" height="96" rx="6" class="card"/>
  <text x="310" y="82" font-size="12" font-weight="bold">1. Medianera norte</text>
  <text x="310" y="96" class="leg">Descripción que escribiste (opcional)</text>
  <line x1="310" y1="104" x2="530" y2="104" class="line"/>
  <text x="310" y="120" class="leg">Coordenadas E, N, cota de P1 y P2</text>
  <text x="310" y="136" class="leg">Distancia, desnivel, pendiente, azimut</text>
  <rect x="300" y="170" width="240" height="132" rx="6" class="card"/>
  <text x="310" y="188" font-size="12" font-weight="bold">2. Lote</text>
  <line x1="310" y1="198" x2="530" y2="198" class="line"/>
  <text x="310" y="214" class="leg">Coordenadas de los 4 vértices</text>
  <text x="310" y="230" class="leg">Tramos (con lado de cierre) y ángulos</text>
  <text x="310" y="246" class="leg">Superficie (m² y ha) y perímetro</text>
  <text x="310" y="270" class="leg">+ tabla de puntos replanteados,</text>
  <text x="310" y="284" class="leg">si el proyecto tiene.</text>
</svg>
