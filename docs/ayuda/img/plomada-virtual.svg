<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 300" font-family="sans-serif">
  <style>
    .lbl { font-size: 13px; fill: #222; }
    .leg { font-size: 12px; fill: #555; }
    .ring { fill: none; stroke: #ccc; stroke-width: 1.5; }
    .tol { fill: none; stroke: #1FA34A; stroke-width: 2.5; }
    .bubble { fill: #F2B705; }
  </style>
  <rect width="420" height="300" fill="#ffffff"/>
  <text x="20" y="26" font-size="16" font-weight="bold">Plomada virtual (nivel de burbuja)</text>

  <circle cx="200" cy="170" r="100" class="ring"/>
  <circle cx="200" cy="170" r="66" class="ring"/>
  <circle cx="200" cy="170" r="33" class="ring"/>
  <circle cx="200" cy="170" r="10" class="tol"/>
  <line x1="100" y1="170" x2="300" y2="170" stroke="#ddd"/>
  <line x1="200" y1="70" x2="200" y2="270" stroke="#ddd"/>

  <circle cx="232" cy="150" r="14" fill="#F2B705" fill-opacity="0.3"/>
  <circle cx="232" cy="150" r="9" class="bubble"/>

  <text x="20" y="295" class="leg">Burbuja centrada = jalón a plomo · tolerancia por defecto 0,3° (≈5 mm/m)</text>
</svg>
