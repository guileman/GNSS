<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 300" font-family="sans-serif">
  <style>
    .lbl { font-size: 13px; fill: #222; }
    .leg { font-size: 12px; fill: #555; }
    .outer { fill: #0E7C86; fill-opacity: 0.18; stroke: #0E7C86; stroke-width: 2.5; }
    .hole { fill: #ffffff; stroke: #D7263D; stroke-width: 2; stroke-dasharray: 4 3; }
  </style>
  <rect width="420" height="300" fill="#ffffff"/>
  <text x="20" y="26" font-size="16" font-weight="bold">Superficie con descuento de edificado</text>
  <polygon points="40,240 60,80 300,60 360,220 180,260" class="outer"/>
  <polygon points="140,190 150,120 260,110 270,180 200,210" class="hole"/>
  <text x="50" y="255" class="leg">Lote (perímetro relevado)</text>
  <text x="155" y="155" class="leg" fill="#D7263D">Edificado</text>
  <text x="20" y="285" class="leg">Superficie neta = superficie del lote − superficie(s) de edificado</text>
</svg>
