name: Android CI

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write   # necesario para publicar el APK como Release en tags v*

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle (con caché)
        uses: gradle/actions/setup-gradle@v4

      - name: Permisos del wrapper
        run: chmod +x gradlew

      # Firma opcional: si existen los secretos se usa tu keystore; si no, se firma con la clave debug.
      - name: Preparar keystore de release
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Tests unitarios (geodesia, NMEA, COGO)
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest 2>&1 | tee test.log

      - name: Compilar APK release
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: |
          set -o pipefail
          ./gradlew assembleRelease 2>&1 | tee build.log

      # Publica los errores de compilación como anotaciones visibles en la pestaña Actions
      - name: Resumen de errores
        if: failure()
        run: |
          cat test.log build.log 2>/dev/null | grep -v "> Task" | grep -E -A4 "^e: |What went wrong" | grep -v "^--$" | head -40 > errors.txt || true
          while IFS= read -r line; do echo "::error::${line}"; done < errors.txt
          { echo '### Errores'; echo '```'; cat errors.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Renombrar APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk "dist/TopoGNSS-${GITHUB_RUN_NUMBER}.apk"
          ls -la dist

      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: TopoGNSS-apk
          path: dist/*.apk
          retention-days: 30

      # Cada push a main publica un Release (v1.0.<n>, igual a la versionName de la app);
      # un tag v* manual publica con ese nombre. La página de descarga toma siempre el último.
      - name: Publicar Release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v1.0.{0}', github.run_number) }}
          name: TopoGNSS ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v1.0.{0}', github.run_number) }}
          generate_release_notes: true
          make_latest: true
          files: dist/*.apk
